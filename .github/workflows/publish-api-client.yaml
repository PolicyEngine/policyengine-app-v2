# Publishes @policyengine/api-client to npm.
#
# Started by hand only (Actions → "Publish @policyengine/api-client" → Run
# workflow), never by a push. It publishes the version in
# packages/api-client/package.json, and does nothing if npm already has it.
# It publishes directly with npm publish, not npm stage publish, so the
# version is public when the run finishes.
#
# It uses npm trusted publishing: GitHub's OIDC token proves the workflow
# runs in PolicyEngine/policyengine-app-v2, so no npm token is stored. The
# package's trusted publisher on npmjs.com is to name this repository, this
# workflow file and the environment npm-publish, and to allow npm publish.
# This file's main-only conditions are not among what npm checks: a copy of
# this file run from another branch could leave them out. So the publish
# job runs in the environment npm-publish, whose deployment branches the
# repository's settings are to limit to main. Set that branch rule before
# the trusted publisher names the environment: a run that names a missing
# environment creates it with no restrictions. The steps, in order, are
# under "Releases" in packages/api-client/README.md. The first version,
# 0.1.0, was published by hand, since npm needs a package to exist before
# it can trust a workflow.

name: Publish @policyengine/api-client

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test, build and pack
    # Only main is published.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      package-version: ${{ steps.pack.outputs.package-version }}
      tarball: ${{ steps.pack.outputs.tarball }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run the package's tests
        working-directory: ./packages/api-client
        run: bun run test

      - name: Build and pack the package
        id: pack
        working-directory: ./packages/api-client
        run: |
          set -o pipefail
          bun run build
          tarball="$(npm pack --ignore-scripts | tail -n 1)"
          # Anything but a tarball here would make the publish job publish a
          # directory, which runs the package's scripts there.
          case "${tarball}" in
            *.tgz) ;;
            *) echo "npm pack named no tarball: '${tarball}'" >&2; exit 1 ;;
          esac
          echo "tarball=${tarball}" >> "$GITHUB_OUTPUT"
          echo "package-version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Keep the tarball for the publish job
        uses: actions/upload-artifact@v4
        with:
          name: api-client-tarball
          path: packages/api-client/${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 1

  # Holds the OIDC permission, so it runs no install and no repository
  # code: it only publishes the tarball the build job made. It runs in the
  # npm-publish environment because npm's trusted publisher is to name that
  # environment, and the environment's branch rule is to allow only main
  # (see the header).
  publish:
    name: Publish
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Fetch the tarball
        uses: actions/download-artifact@v4
        with:
          name: api-client-tarball

      # Trusted publishing needs npm 11.5.1 or later, which Node 24 ships.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Publish unless npm already has this version
        env:
          PACKAGE_VERSION: ${{ needs.build.outputs.package-version }}
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: |
          npm --version
          if npm view "@policyengine/api-client@${PACKAGE_VERSION}" version > /dev/null 2>&1; then
            echo "npm already has @policyengine/api-client ${PACKAGE_VERSION}; nothing to publish."
            exit 0
          fi
          npm publish "./${TARBALL}" --access public --provenance --ignore-scripts
