# Releases @policyengine/api-client to npm.
#
# Runs on every push to main, and can be started by hand on main (Actions →
# "Publish @policyengine/api-client" → Run workflow) to retry a failed release.
# Each run compares main's newest commit with npm and with
# packages/api-client/changelog.d, so a retry needs no inputs:
#
# 1. If npm lacks the version in package.json, the run tests, builds and
#    publishes it.
# 2. If changelog fragments are waiting, the run raises the version according
#    to their types, writes CHANGELOG.md and pushes that commit to main. That
#    push starts the next run, which publishes the new version in step 1, so
#    npm's provenance names the commit that holds exactly what was published.
#
# A run on a commit that is no longer main's newest does nothing: the push that
# moved main started its own run, and that run sees the same fragments.
#
# The pull-request rule in the protect-master ruleset stops the workflow's own
# token from pushing to main. The release commit is pushed with a token for the
# organisation's `policyengine` GitHub App, which that ruleset lists as allowed
# to bypass the rule. The token comes from the organisation secrets APP_ID and
# APP_PRIVATE_KEY, is limited to writing this repository's contents, and is made
# only after the steps that run other code have finished.
#
# It publishes directly with npm publish, not npm stage publish, so a version
# is public when the run finishes.
#
# It uses npm trusted publishing: GitHub's OIDC token proves the workflow
# runs in PolicyEngine/policyengine-app-v2, so no npm token is stored. The
# package's trusted publisher on npmjs.com is to name this repository, this
# workflow file and the environment npm-publish, and to allow npm publish.
# This file's main-only conditions are not among what npm checks: a copy of
# this file run from another branch could leave them out. So the publish
# job runs in the environment npm-publish, whose deployment branches the
# repository's settings are to limit to main. Set that branch rule before
# the trusted publisher names the environment: a run that names a missing
# environment creates it with no restrictions. The steps, in order, are
# under "Releases" in packages/api-client/README.md. The first version,
# 0.1.0, was published by hand, since npm needs a package to exist before
# it can trust a workflow.

name: Publish @policyengine/api-client

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run at a time on each branch, so two runs never raise the same version.
# Waiting runs are not cancelled by this workflow. GitHub keeps only the newest
# one waiting, which is enough: it sees every fragment the older ones would.
concurrency:
  group: publish-api-client-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Decide what this run releases
    # Only main is released.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      raise-version: ${{ steps.decide.outputs.raise-version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Compare main with npm and the changelog fragments
        id: decide
        run: |
          set -euo pipefail
          publish=false
          raise_version=false
          main_tip="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
          if [ "${main_tip}" != "${GITHUB_SHA}" ]; then
            echo "main has moved on to ${main_tip}; the run for that commit does the release."
          else
            version="$(node -p "require('./packages/api-client/package.json').version")"
            npm_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              "https://registry.npmjs.org/@policyengine%2fapi-client/${version}")"
            case "${npm_status}" in
              200) echo "npm already has ${version}." ;;
              404) echo "npm does not have ${version}."; publish=true ;;
              *) echo "npm answered ${npm_status} for ${version}." >&2; exit 1 ;;
            esac
            fragment_count="$(find packages/api-client/changelog.d -type f ! -name .gitkeep | wc -l)"
            echo "Changelog fragments waiting: ${fragment_count}."
            if [ "${fragment_count}" -gt 0 ]; then
              raise_version=true
            fi
          fi
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"
          echo "raise-version=${raise_version}" >> "$GITHUB_OUTPUT"

  build:
    name: Test, build and pack
    needs: plan
    if: github.ref == 'refs/heads/main' && needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    outputs:
      package-version: ${{ steps.pack.outputs.package-version }}
      tarball: ${{ steps.pack.outputs.tarball }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run the package's tests
        working-directory: ./packages/api-client
        run: bun run test

      - name: Build and pack the package
        id: pack
        working-directory: ./packages/api-client
        run: |
          set -o pipefail
          bun run build
          tarball="$(npm pack --ignore-scripts | tail -n 1)"
          # Anything but a tarball here would make the publish job publish a
          # directory, which runs the package's scripts there.
          case "${tarball}" in
            *.tgz) ;;
            *) echo "npm pack named no tarball: '${tarball}'" >&2; exit 1 ;;
          esac
          echo "tarball=${tarball}" >> "$GITHUB_OUTPUT"
          echo "package-version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Keep the tarball for the publish job
        uses: actions/upload-artifact@v4
        with:
          name: api-client-tarball
          path: packages/api-client/${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 1

  # Holds the OIDC permission, so it runs no install and no repository
  # code: it only publishes the tarball the build job made. It runs in the
  # npm-publish environment because npm's trusted publisher is to name that
  # environment, and the environment's branch rule is to allow only main
  # (see the header).
  publish:
    name: Publish
    needs: [plan, build]
    if: github.ref == 'refs/heads/main' && needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Fetch the tarball
        uses: actions/download-artifact@v4
        with:
          name: api-client-tarball

      # Trusted publishing needs npm 11.5.1 or later, which Node 24 ships.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Publish unless npm already has this version
        env:
          PACKAGE_VERSION: ${{ needs.build.outputs.package-version }}
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: |
          npm --version
          if npm view "@policyengine/api-client@${PACKAGE_VERSION}" version > /dev/null 2>&1; then
            echo "npm already has @policyengine/api-client ${PACKAGE_VERSION}; nothing to publish."
            exit 0
          fi
          npm publish "./${TARBALL}" --access public --provenance --ignore-scripts

  # Runs after any publish in this run, so a version that is still missing from
  # npm goes out before the next one is started. It installs no dependencies,
  # and it makes the GitHub App token only after everything else has run.
  release-commit:
    name: Commit the next version to main
    needs: [plan, build, publish]
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.plan.result == 'success' &&
      needs.plan.outputs.raise-version == 'true' &&
      contains(fromJSON('["success", "skipped"]'), needs.build.result) &&
      contains(fromJSON('["success", "skipped"]'), needs.publish.result)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install towncrier
        run: python -m pip install "towncrier==26.9.0"

      - name: Raise the version
        id: version
        run: echo "version=$(node packages/api-client/scripts/raise-version.mjs)" >> "$GITHUB_OUTPUT"

      - name: Write the changelog
        working-directory: ./packages/api-client
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: towncrier build --yes --version "${VERSION}" --config towncrier.toml --dir .

      - name: Commit the release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "policyengine[bot]"
          git config user.email "239815650+policyengine[bot]@users.noreply.github.com"
          git add bun.lock packages/api-client/package.json packages/api-client/CHANGELOG.md packages/api-client/changelog.d
          git commit --message "Release @policyengine/api-client ${VERSION}"

      - name: Get a token that can push past the pull-request rule
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Push the release commit to main
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -uo pipefail
          repository_url="https://github.com/${GITHUB_REPOSITORY}.git"
          if git push "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/main; then
            exit 0
          fi
          main_tip="$(git ls-remote "${repository_url}" refs/heads/main | cut -f1)"
          if [ -n "${main_tip}" ] && [ "${main_tip}" != "${GITHUB_SHA}" ]; then
            echo "main moved on to ${main_tip} during this run; the run for that commit does the release."
            exit 0
          fi
          echo "The push was refused although main has not moved." >&2
          exit 1
