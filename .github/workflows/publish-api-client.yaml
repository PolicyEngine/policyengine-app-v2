# Releases @policyengine/api-client to npm, the way PolicyEngine's other
# packages are released.
#
# Every merge to main runs this workflow twice when it brings changelog
# fragments. On the merge commit, versioning raises the version from the
# fragments' types with packages/api-client/.github/bump_version.py, builds
# CHANGELOG.md with towncrier, and commits both as "Update
# @policyengine/api-client". The commit holds only files in packages/api-client.
# On that release commit, the other jobs test, build and publish it, so npm's
# provenance names the commit that holds exactly what was published. A merge
# without fragments does nothing.
#
# The release commit is pushed with a token for the organisation's
# `policyengine` GitHub App. Unlike the workflow's own token, the App is on the
# bypass list of the protect-master ruleset, and its push starts the second run.
# The token comes from the organisation secrets APP_ID and APP_PRIVATE_KEY, is
# limited to writing this repository's contents, and is made after the version
# and changelog steps have run.
#
# If a merge lands while versioning runs, the push is refused and the job fails.
# Nothing is lost: the fragments are still on main, and the newer merge's run
# releases them.
#
# To retry a failed release, start the workflow by hand on main (Actions →
# "Publish @policyengine/api-client" → Run workflow). It releases any fragments
# still waiting, and publishes the version in package.json if npm lacks it.
#
# It publishes directly with npm publish, not npm stage publish, so a version
# is public when the run finishes.
#
# It uses npm trusted publishing: GitHub's OIDC token proves the workflow
# runs in PolicyEngine/policyengine-app-v2, so no npm token is stored. The
# package's trusted publisher on npmjs.com is to name this repository, this
# workflow file and the environment npm-publish, and to allow npm publish.
# This file's main-only conditions are not among what npm checks: a copy of
# this file run from another branch could leave them out. So the publish
# job runs in the environment npm-publish, whose deployment branches the
# repository's settings are to limit to main. Set that branch rule before
# the trusted publisher names the environment: a run that names a missing
# environment creates it with no restrictions. The steps, in order, are
# under "Releases" in packages/api-client/README.md. The first version,
# 0.1.0, was published by hand, since npm needs a package to exist before
# it can trust a workflow.

name: Publish @policyengine/api-client

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  versioning:
    name: Update versioning
    # A manual run has no head commit, so it passes this check.
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event.head_commit.message != 'Update @policyengine/api-client'
    runs-on: ubuntu-latest
    # One at a time, so two runs never raise the same version. On the job, so
    # that a merge waiting here can't displace a release commit waiting to
    # publish. GitHub keeps only the newest waiting run, which sees every
    # fragment the older ones would.
    concurrency:
      group: api-client-versioning
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check for changelog fragments
        id: check
        working-directory: ./packages/api-client
        run: |
          main_tip="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
          if [ "${main_tip}" != "${GITHUB_SHA}" ]; then
            echo "main has moved on to ${main_tip}; the run for that commit releases any fragments."
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          .github/check_fragments.sh

      - name: Set up Python
        if: steps.check.outputs.count != '0'
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install towncrier
        if: steps.check.outputs.count != '0'
        run: python -m pip install "towncrier==26.9.0"

      - name: Bump version
        if: steps.check.outputs.count != '0'
        working-directory: ./packages/api-client
        run: python .github/bump_version.py

      - name: Build changelog
        if: steps.check.outputs.count != '0'
        working-directory: ./packages/api-client
        run: towncrier build --yes --version "$(python -c "import json; print(json.load(open('package.json'))['version'])")"

      - name: Generate GitHub App token
        id: app-token
        if: steps.check.outputs.count != '0'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write

      # The checkout kept no credentials, so the steps above never had a token.
      - name: Let git push with the App token
        if: steps.check.outputs.count != '0'
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: git remote set-url origin "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

      - name: Commit the release to main
        if: steps.check.outputs.count != '0'
        uses: EndBug/add-and-commit@v10
        with:
          add: packages/api-client
          author_name: Github Actions[bot]
          committer_name: Github Actions[bot]
          message: Update @policyengine/api-client
          github_token: ${{ steps.app-token.outputs.token }}
          fetch: false

  build:
    name: Test, build and pack
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event.head_commit.message == 'Update @policyengine/api-client' ||
      github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    outputs:
      package-version: ${{ steps.pack.outputs.package-version }}
      tarball: ${{ steps.pack.outputs.tarball }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run the package's tests
        working-directory: ./packages/api-client
        run: bun run test

      - name: Build and pack the package
        id: pack
        working-directory: ./packages/api-client
        run: |
          set -o pipefail
          bun run build
          tarball="$(npm pack --ignore-scripts | tail -n 1)"
          # Anything but a tarball here would make the publish job publish a
          # directory, which runs the package's scripts there.
          case "${tarball}" in
            *.tgz) ;;
            *) echo "npm pack named no tarball: '${tarball}'" >&2; exit 1 ;;
          esac
          echo "tarball=${tarball}" >> "$GITHUB_OUTPUT"
          echo "package-version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Keep the tarball for the publish job
        uses: actions/upload-artifact@v4
        with:
          name: api-client-tarball
          path: packages/api-client/${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 1

  # Holds the OIDC permission, so it runs no install and no repository
  # code: it only publishes the tarball the build job made. It runs in the
  # npm-publish environment because npm's trusted publisher is to name that
  # environment, and the environment's branch rule is to allow only main
  # (see the header).
  publish:
    name: Publish
    needs: build
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event.head_commit.message == 'Update @policyengine/api-client' ||
      github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: npm-publish
    # One publish at a time, so an older version can't become latest after a
    # newer one.
    concurrency:
      group: api-client-npm
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Fetch the tarball
        uses: actions/download-artifact@v4
        with:
          name: api-client-tarball

      # Trusted publishing needs npm 11.5.1 or later, which Node 24 ships.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Publish unless npm already has this version
        env:
          PACKAGE_VERSION: ${{ needs.build.outputs.package-version }}
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: |
          npm --version
          if npm view "@policyengine/api-client@${PACKAGE_VERSION}" version > /dev/null 2>&1; then
            echo "npm already has @policyengine/api-client ${PACKAGE_VERSION}; nothing to publish."
            exit 0
          fi
          npm publish "./${TARBALL}" --access public --provenance --ignore-scripts
