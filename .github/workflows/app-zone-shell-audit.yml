name: App-zone shell audit

on:
  pull_request:
    paths:
      - "website/src/data/appZoneRoutes.ts"
      - ".github/scripts/audit-app-zone-shell.mjs"
      - ".github/scripts/audit-app-zone-shell.test.mjs"
      - ".github/workflows/app-zone-shell-audit.yml"
  workflow_dispatch:
    inputs:
      protected_qa:
        description: Supplemental protected report QA; begin with preflight
        type: choice
        default: "off"
        options: ["off", "preflight", "browser"]
      host_deployment_id:
        description: Immutable Vercel host preview deployment ID
        type: string
      child_deployment_id:
        description: Immutable Vercel child deployment ID
        type: string
      child_build_receipt:
        description: Root-reviewed manual child build receipt JSON (empty for Git builds)
        type: string
      child_build_receipt_sha256:
        description: SHA256 of the exact reviewed receipt JSON bytes
        type: string
  schedule:
    - cron: "17 9 * * *"

jobs:
  audit:
    name: Audit PolicyEngine shell on app-zone routes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      # This job connects to production sites over HTTPS, and Node.js checks
      # certificates against a CA list compiled into its binary. Node 20 gets
      # no release that drops the compromised eMudhra (emSign) CAs, so this
      # uses Node 24. check-latest skips the runner's cached 24.x, which can
      # be older than 24.22.1, the first 24.x release without them.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          check-latest: true

      - name: Run app-zone audit unit tests
        run: node --test .github/scripts/audit-app-zone-shell.test.mjs

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.21"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: node node_modules/playwright/cli.js install --with-deps chromium

      - name: Run app-zone shell audit
        env:
          APP_ZONE_ALLOW_DESTINATION_FALLBACK: ${{ github.event_name == 'pull_request' && '1' || '0' }}
        run: node .github/scripts/audit-app-zone-shell.mjs

      - name: File or bump an issue when the scheduled audit fails
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Production zone-shell audit is failing"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" \
              --body "Still failing: $run_url"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "The scheduled app-zone shell audit failed: $run_url

          A zone child stopped rendering the PolicyEngine site shell, or a route is down or erroring. Every embedded tool renders the shell itself (CLAUDE.md → Embedded sites → The shell rule); the child repo's own CI shell guard should catch this at PR time — fix the child and check why its guard did not."
          fi

  protected-report-qa:
    name: Supplemental protected report QA
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.protected_qa == 'preflight' || inputs.protected_qa == 'browser') &&
      github.repository == 'PolicyEngine/policyengine-app-v2' &&
      github.ref == 'refs/heads/codex/rent-property-tax-tool'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      QA_HOST_DEPLOYMENT_ID: ${{ inputs.host_deployment_id }}
      QA_CHILD_DEPLOYMENT_ID: ${{ inputs.child_deployment_id }}
      QA_CHILD_BUILD_RECEIPT: ${{ inputs.child_build_receipt }}
      QA_CHILD_BUILD_RECEIPT_SHA256: ${{ inputs.child_build_receipt_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: PolicyEngine/property-tax-relief
          ref: 62b668978ccdb79cf4dd8ac88816e7de54e96209
          path: qa-child
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          check-latest: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.21"
      - name: Install frozen host dependencies
        run: bun install --frozen-lockfile
      - name: Test credential boundaries without credentials
        run: node node_modules/vitest/vitest.mjs run .github/scripts/property-tax-protected-qa.test.mjs --environment node --maxWorkers 4
      - name: Build pinned child without deployment credentials
        working-directory: qa-child
        run: |
          bun install --frozen-lockfile
          bun run build:zone
      - name: Validate deployment, source and alias identities before bypass credentials
        id: metadata
        env:
          VERCEL_QA_METADATA_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node .github/scripts/property-tax-protected-qa.mjs metadata
      - name: Run only the bounded auth matrix
        id: preflight
        env:
          PROPERTY_TAX_QA_HOST_BYPASS: ${{ secrets.PROPERTY_TAX_QA_HOST_BYPASS }}
          PROPERTY_TAX_QA_CHILD_BYPASS: ${{ secrets.PROPERTY_TAX_QA_CHILD_BYPASS }}
        run: node .github/scripts/property-tax-protected-qa.mjs preflight
      - name: Recheck source and alias after preflight
        if: always() && steps.metadata.outcome == 'success'
        env:
          VERCEL_QA_METADATA_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node .github/scripts/property-tax-protected-qa.mjs recheck
      - name: Install Chromium only for requested browser phase
        if: success() && inputs.protected_qa == 'browser'
        run: node node_modules/playwright/cli.js install --with-deps chromium
      - name: Check actual rendered protected child and host preview
        if: success() && inputs.protected_qa == 'browser'
        env:
          PROPERTY_TAX_QA_HOST_BYPASS: ${{ secrets.PROPERTY_TAX_QA_HOST_BYPASS }}
          PROPERTY_TAX_QA_CHILD_BYPASS: ${{ secrets.PROPERTY_TAX_QA_CHILD_BYPASS }}
        run: node .github/scripts/property-tax-protected-qa.mjs browser
      - name: Recheck source and alias after browser phase
        if: always() && steps.metadata.outcome == 'success' && inputs.protected_qa == 'browser'
        env:
          VERCEL_QA_METADATA_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node .github/scripts/property-tax-protected-qa.mjs recheck
      - name: Upload sanitized supplemental QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protected-report-qa
          retention-days: 7
          if-no-files-found: ignore
          path: |
            output/property-tax-protected-qa/manifest.json
            output/property-tax-protected-qa/preflight.json
            output/property-tax-protected-qa/browser.json
            output/property-tax-protected-qa/recheck.json
            output/property-tax-protected-qa/failure.json
            output/property-tax-protected-qa/mismatched-turbopack-runtime.js
            output/property-tax-protected-qa/*-desktop.png
            output/property-tax-protected-qa/*-mobile.png
            output/property-tax-protected-qa/*-inventory.csv
            output/property-tax-protected-qa/*-inventory.json
